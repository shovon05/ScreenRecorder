name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode release keystore (if configured)
      # Only runs if the RELEASE_KEYSTORE_BASE64 secret has been set in this repo's
      # Settings > Secrets and variables > Actions. Without it, the build below
      # automatically falls back to debug signing (see app/build.gradle.kts) so CI
      # still produces an installable APK rather than failing or shipping unsigned.
      if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks
        cat > keystore.properties <<EOF
        storeFile=${{ github.workspace }}/release.jks
        storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
        keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
        EOF

    - name: Build Release APK
      # Compiling the release variant strips out all debug bloat
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release.apk
